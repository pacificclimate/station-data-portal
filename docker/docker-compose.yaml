# Run via the `docker:*` npm scripts.
#
# `SDP_TAG`: image tag; default `local` (a `docker:build` of the working tree)
# `SDP_PORT`: host port; default 30503, matching `PUBLIC_URL` in `config.bc.js`

services:
  frontend:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    image: pcic/station-data-portal-frontend:${SDP_TAG:-local}
    container_name: station-data-portal-frontend
    volumes:
      - ./config.bc.js:/app/config.js
    ports:
      - "${SDP_PORT:-30503}:8080"
