# Serves the built app from /app. Installed as the image's default server.
#
# The services.pacificclimate.org proxy strips the app's path, so every
# request arrives as if the app were at the root. Nothing here redirects, so
# no response can send a browser to a path without the prefix.

server {
    listen 8080;
    root /app;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
        application/manifest+json image/svg+xml;

    # Hashed build output: a missing file is a real 404, and a file never
    # changes under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public files (config.js, favicon, manifest, ...) and, for any other
    # path, index.html, so client-side routes such as /preview/<stationId>
    # survive a hard refresh. Unhashed, so browsers revalidate every load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
